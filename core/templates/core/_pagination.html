{% if page_obj.paginator.num_pages > 1 %}
<nav class="pager">
  {% with qs=request.GET.urlencode %}
  {% if page_obj.has_previous %}<a href="?{% if qs %}{{ qs }}&{% endif %}page={{ page_obj.previous_page_number }}">&laquo; Prev</a>{% endif %}
  <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} ({{ page_obj.paginator.count }} total)</span>
  {% if page_obj.has_next %}<a href="?{% if qs %}{{ qs }}&{% endif %}page={{ page_obj.next_page_number }}">Next &raquo;</a>{% endif %}
  {% endwith %}
</nav>
{% endif %}
